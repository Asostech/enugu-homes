<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up — Enugu Homes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="logo" href="index.html"><span class="logo-mark">EH</span> Enugu Homes</a>
      <nav id="nav">
        <a href="login.html">Log in</a>
        <a class="btn btn-outline" href="index.html">Home</a>
      </nav>
    </div>
  </header>
  <main class="auth-page">
    <div class="auth-box">
      <h2>Create your account</h2>
      <p class="sub">Landlords and agents list property. Tenants and buyers save and contact listings.</p>
      <form class="form panel" id="signupForm">
        <div>
          <label>Full name</label>
          <input name="name" required placeholder="Peter Mbah" />
        </div>
        <div>
          <label>Email</label>
          <input name="email" type="email" required placeholder="you@email.com" />
        </div>
        <div>
          <label>WhatsApp number</label>
          <input name="phone" required placeholder="23480..." />
        </div>
        <div>
          <label>I am a</label>
          <div class="roles">
            <label><input type="radio" name="role" value="landlord" checked /> Landlord</label>
            <label><input type="radio" name="role" value="agent" /> Agent</label>
            <label><input type="radio" name="role" value="seeker" /> Tenant / buyer</label>
          </div>
        </div>
                <div>
          <label>Password</label>
          <div style="display:flex;gap:8px">
            <input name="password" id="pw" type="password" required minlength="8" />
            <button class="btn btn-outline" type="button" id="togglePw">Show</button>
          </div>
          <p class="meta">Use 8+ characters with uppercase, lowercase, a number and a symbol (!@#$%).</p>
        </div>
        <p id="err" style="color:#9b1c1c"></p>
                <div class="g-recaptcha" data-sitekey="6Lc7W7ktAAAAACndgnwN1zqTcJg7XVt3fPF-8TTm"></div>
        <button class="btn btn-primary" type="submit">Sign up</button>
        <p class="meta">Already have an account? <a href="login.html">Log in</a></p>
        </form>
    </div>
  </main>
      <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="js/data.js"></script>
  <script src="js/fb.js"></script>
  <script src="js/auth.js"></script>
      <script>
    document.getElementById("signupForm").onsubmit = async (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target).entries());
      const err = document.getElementById("err");
            const pw = f.password || "";
      const strong = /[A-Z]/.test(pw) && /[a-z]/.test(pw) && /[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw) && pw.length >= 8;
      if (!strong) {
        err.textContent = "Password must be 8+ characters and include uppercase, lowercase, a number and a symbol.";
        return;
      }
            if (window.grecaptcha && SITE.recaptchaSiteKey) {
        const token = grecaptcha.getResponse();
        if (!token) {
          err.textContent = "Tick the I'm not a robot box.";
          return;
        }
      }
      try {
        const res = await fbSignup(f);
        if (!res.ok) { err.textContent = res.error; return; }
        alert("Account created. Check Gmail for a verification link, then log in.");
        location.href = "login.html";
      } catch (ex) {
        err.textContent = mapAuthError(ex);
      }
    };
        document.getElementById("togglePw")?.addEventListener("click", () => {
      const box = document.getElementById("pw");
      const btn = document.getElementById("togglePw");
      const show = box.type === "password";
      box.type = show ? "text" : "password";
      btn.textContent = show ? "Hide" : "Show";
    });
  </script>
</body>
</html>
